services:

  postgres-db:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_DB: automated_testing
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: app123

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  demo-app:
    build: .
    container_name: demo-app

    ports:
      - "8081:8081"

    depends_on:
      - postgres-db

volumes:
  postgres-data: